<!doctype html>
<html lang="en" theme-mode="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: mhub-img:; style-src 'self' 'unsafe-inline'; font-src 'self'" />
  <title>OpenMHub</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="keyboard.css" />
  <link rel="stylesheet" href="macros.css" />
  <link rel="stylesheet" href="profiles.css" />
  <link rel="stylesheet" href="tester.css" />
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="tb-left" id="tb-left"></div>
    <div class="tb-drag"></div>
    <div class="tb-right">
      <button class="icon-btn" id="btn-refresh"></button>
      <button class="icon-btn" id="btn-theme"></button>
      <button class="icon-btn" id="btn-settings"></button>
      <span class="tb-divider"></span>
      <button class="icon-btn win" data-win="min"></button>
      <button class="icon-btn win" data-win="max"></button>
      <button class="icon-btn win" data-win="close"></button>
    </div>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
